name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  # Fails fast, before any platform build, if the pushed tag doesn't match
  # CMakeLists.txt's VERSION (the field `make version x.y.z` rewrites and
  # PLUGIN_VERSION is scraped from for artifact filenames). The pre-push
  # hook in .githooks/ catches this locally, but it's opt-in
  # (`make hooks`) - this is the non-optional backstop.
  check-version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches CMakeLists.txt VERSION
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cmake_version=$(sed -n -E 's/^project[^V]*VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          if [ "$tag" != "$cmake_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match CMakeLists.txt's VERSION $cmake_version"
            exit 1
          fi

  macos:
    needs: check-version
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: brew install cmake simde

      - name: Install OBS
        run: brew install --cask obs

      - name: Build and package
        run: make package

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: build/dist/*.dmg

  linux:
    needs: check-version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libobs-dev

      - name: Build and package
        run: make package

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: build/dist/*.deb

  windows:
    # Cross-compiled from Linux via mingw-w64, and the installer itself is
    # built from Linux via makensis - see deps-windows.sh,
    # cmake/mingw-w64-toolchain.cmake and cmake/installer.nsi. Nothing is
    # built on actual Windows.
    needs: check-version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc-mingw-w64-x86-64 nsis

      - name: Build and package
        run: make package-windows

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/dist/*.exe

  release:
    needs: [macos, linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*/*
          generate_release_notes: true
